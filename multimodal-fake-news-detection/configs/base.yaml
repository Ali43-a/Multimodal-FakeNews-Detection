project:
  name: multimodal-fake-news-detection
  seed: 42

task:
  type: binary_classification
  num_classes: 2

data:
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  num_workers: 4

training:
  epochs: 5
  early_stopping_patience: 2

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc
    - pr_auc
